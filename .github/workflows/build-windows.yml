name: Build Harness Desktop

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Полный 40-символьный commit SHA из maximnaumov20-alt/harness-desktop"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: harness-desktop-build
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Validate source SHA
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if ($env:SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "source_sha must be a full 40-character commit SHA."
          }

      - name: Check source access secret
        shell: pwsh
        env:
          SOURCE_TOKEN: ${{ secrets.HARNESS_SOURCE_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SOURCE_TOKEN)) {
            throw "Missing HARNESS_SOURCE_READ_TOKEN. Configure the read-only secret as described in README.md."
          }

      - name: Checkout private source at exact commit
        uses: actions/checkout@v4
        with:
          repository: maximnaumov20-alt/harness-desktop
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.HARNESS_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify checked-out revision
        shell: pwsh
        working-directory: source
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Checked-out commit does not match requested SHA."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        working-directory: source
        run: npm ci

      - name: Run frontend contract checks
        working-directory: source
        run: npm run test:contract

      - name: Build frontend
        working-directory: source
        run: npm run build

      - name: Check Rust formatting
        working-directory: source
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Build Tauri installers
        working-directory: source
        run: npm run tauri -- build

      - name: Collect only installers
        shell: pwsh
        working-directory: source
        run: |
          $destination = Join-Path $env:GITHUB_WORKSPACE "installers"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $files = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -File |
            Where-Object { $_.Extension -in @(".msi", ".exe") }
          if (-not $files -or $files.Count -eq 0) {
            throw "No MSI or EXE installers were produced."
          }
          foreach ($file in $files) {
            Copy-Item -LiteralPath $file.FullName -Destination $destination
          }
          $unexpected = Get-ChildItem -Path $destination -File |
            Where-Object { $_.Extension -notin @(".msi", ".exe") }
          if ($unexpected) {
            throw "Unexpected file type found in installer output."
          }
          Get-ChildItem -Path $destination -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $((Split-Path $_.Path -Leaf))" } |
            Set-Content -Encoding ascii (Join-Path $destination "SHA256SUMS.txt")

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: harness-desktop-installers
          path: installers/*
          if-no-files-found: error
          retention-days: 14
